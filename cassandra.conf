# Connection settings for cassandra_function_tests
# Format: "key = value" per line, "#" starts a comment.
# Environment variables (CASSANDRA_HOST, CASSANDRA_PORT, CASSANDRA_PROTOCOL,
# CASSANDRA_USER, CASSANDRA_PASSWORD, CASSANDRA_KEYSPACE) override these values.

host     = 127.0.0.1
port     = 9042
protocol = v4
user     = appuser
password = appuser123
keyspace = demo

# The same settings can be given as one connection string:
# connection = contact points=127.0.0.1; port=9042; protocol=v4; username=appuser; password=appuser123; keyspace=demo
